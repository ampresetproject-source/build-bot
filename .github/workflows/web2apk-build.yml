name: Web2APK Build
run-name: "Build ${{ inputs.tag }}"

# NOTE: this workflow assumes your repo contains a "web2apk-template" Flutter
# project (a minimal WebView-wrapper app) that reads WEB_URL / APP_NAME from
# --dart-define and uses assets/icon.png as its launcher icon. Adjust the
# working-directory / build steps below to match however your template works.

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Website URL to wrap into an APK"
        required: true
      app_name:
        description: "Display name of the generated app"
        required: true
      icon_url:
        description: "Direct-downloadable URL of the app icon (PNG)"
        required: true
      tag:
        description: "Unique tag used to match this run back to the bot"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web2apk template
        uses: actions/checkout@v4
        with:
          repository: your-github-username/web2apk-template
          path: project

      - name: Download icon
        run: curl -L "${{ inputs.icon_url }}" -o project/assets/icon.png

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: project
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        working-directory: project
        run: >
          flutter build apk --release
          --dart-define=WEB_URL="${{ inputs.web_url }}"
          --dart-define=APP_NAME="${{ inputs.app_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: project/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
          
