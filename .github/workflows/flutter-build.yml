name: Flutter Build
run-name: "Build ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct-downloadable URL of the Flutter project ZIP"
        required: true
      tag:
        description: "Unique tag used to match this run back to the bot"
        required: true
      build_type:
        description: "debug or release"
        required: true
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project ZIP
        run: curl -L "${{ inputs.zip_url }}" -o project.zip

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q project.zip -d project
          # If the zip wraps everything in one folder, flatten it
          if [ "$(ls project | wc -l)" = "1" ] && [ -d "project/$(ls project)" ]; then
            inner="project/$(ls project)"
            mv "$inner"/* project/
            rmdir "$inner"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK (debug)
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: project
        run: flutter build apk --debug

      - name: Build APK (release)
        if: ${{ inputs.build_type != 'debug' }}
        working-directory: project
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: project/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
